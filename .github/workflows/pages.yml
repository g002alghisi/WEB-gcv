name: Build and deploy site

# Triggers: every push to main, plus a manual button in the Actions tab
on:
  push:
    branches: [main]
  workflow_dispatch:

# Extra permissions: by default a workflow can only read the repo
permissions:
  contents: read
  pages: write
  id-token: write

# If two deploys overlap, the second one waits for the first
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 1) Build the site
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Ruby and install gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build the site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload the _site folder
        uses: actions/upload-pages-artifact@v3

  # 2) Publish the artifact produced by the build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
