name: Pubblica il sito

# QUANDO parte: a ogni push su main, oppure a mano dalla tab Actions
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permessi extra: di default un workflow puo' solo leggere il repo
permissions:
  contents: read
  pages: write
  id-token: write

# Se lanci due deploy ravvicinati, il secondo aspetta il primo
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 1) Costruisce il sito
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repo
        uses: actions/checkout@v4

      - name: Installa Ruby e le gem del Gemfile
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Prepara la configurazione di Pages
        uses: actions/configure-pages@v5

      - name: Costruisci il sito
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Impacchetta la cartella _site
        uses: actions/upload-pages-artifact@v3

  # 2) Pubblica il pacchetto prodotto dalla build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Metti online
        id: deployment
        uses: actions/deploy-pages@v4
