title: Gruppo Cinofilo Verolese
description: Organizzazione di Volontariato
lang: it

# Public address of the site.
# The custom domain serves the site at the root, so baseurl stays empty.
url: https://gruppocinofiloverolese.it
baseurl: ""

theme: bulma-clean-theme

# Icon shown in the browser tab and in bookmarks
favicon: /assets/images/favicon.png

# Social profiles: the theme renders icon buttons in the footer
social:
  facebook: https://www.facebook.com/people/Gruppo-Cinofilo-Verolese/61557456284030/
  instagram: https://www.instagram.com/gruppocinofiloverolese_/

# Files and folders kept out of the generated site
exclude:
  - old/
  - Gemfile
  - Gemfile.lock
  - README.md
